services:
  postgres:
    image: postgres:16
    container_name: transport-postgres
    environment:
      POSTGRES_DB: transport_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "15432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d transport_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: transport-orders-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/transport_db
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      APP_USERNAME: admin
      APP_PASSWORD: admin123
      JWT_SECRET: transport-orders-docker-secret-key-change-me-2026
      UPLOAD_DIR: /app/uploads
    ports:
      - "8080:8080"
    volumes:
      - uploads:/app/uploads

volumes:
  pgdata:
  uploads: