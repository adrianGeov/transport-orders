spring.application.name=transport-orders
server.port=8080

# Base de datos 
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:15432/transport_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Carga de archivos 
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=${UPLOAD_DIR:uploads}

# Seguridad / JWT 
app.security.username=${APP_USERNAME:admin}
app.security.password=${APP_PASSWORD:admin123}
app.jwt.secret=${JWT_SECRET:transport-orders-dev-secret-key-change-me-2026}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}